<style>
  :root {
    --bg: #05060e;
    --bg-soft: #0b0d1a;
    --ink: #e0e6f0;
    --ink-dim: #8899b8;
    --ink-faint: #6b7a99;
    --rule: #182030;
    --accent: #5299c8;
    --sky: #5299c8;
    --lilac: #7272c0;
    --serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --ease: cubic-bezier(.22, .61, .36, 1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 100%; height: 100%; overflow: hidden; }

  body {
    background: var(--bg);
    background-image:
      linear-gradient(rgba(82,153,200,.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(82,153,200,.022) 1px, transparent 1px);
    background-size: 52px 52px;
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  canvas { display: block; }

  /* Atmospheric overlays */
  .grain {
    position: fixed; inset: 0; z-index: 9999; pointer-events: none;
    opacity: .032;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='4' stitchTiles='stitch'/></filter><rect width='256' height='256' filter='url(%23n)'/></svg>");
    background-size: 220px 220px;
    mix-blend-mode: overlay;
  }

  .glow-tl, .glow-br { position: fixed; pointer-events: none; z-index: 0; }

  .glow-tl {
    top: 0; left: 0; width: 55vw; height: 55vh;
    background: radial-gradient(at 0% 0%, rgba(82,153,200,0.07) 0%, transparent 60%);
  }

  .glow-br {
    bottom: 0; right: 0; width: 50vw; height: 50vh;
    background: radial-gradient(at 100% 100%, rgba(114,114,192,0.07) 0%, transparent 65%);
  }

  .edge-gradient {
    position: fixed; top: 0; left: 0; right: 0; height: 2px;
    z-index: 10000; pointer-events: none;
    background: linear-gradient(90deg, transparent 0%, var(--sky) 22%, var(--lilac) 62%, transparent 100%);
    opacity: .55;
  }

  /* Topbar */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 500;
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 14px 48px 12px;
    background: linear-gradient(180deg, rgba(5,6,14,0.95) 0%, rgba(5,6,14,0.70) 70%, transparent 100%);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

  .topbar-title {
    font-family: var(--serif);
    font-weight: 300; font-size: 17px; letter-spacing: -0.015em;
    color: var(--ink);
  }

  .topbar-title em { color: var(--sky); font-style: italic; font-weight: 400; }

  .topbar-eyebrow {
    font-family: var(--mono);
    font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-faint);
  }

  .back-link {
    color: inherit; text-decoration: none;
    border-bottom: 1px dotted var(--ink-faint);
    transition: color 180ms ease, border-color 180ms ease;
    cursor: pointer;
  }
  .back-link:hover, .back-link:focus-visible {
    color: var(--accent); border-bottom-color: var(--accent); outline: none;
  }

  /* Card popup */
  #card {
    position: fixed; z-index: 200;
    width: 300px;
    background: rgba(11,13,26,0.92);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 20px 22px 18px;
    pointer-events: none;
    opacity: 0; transform: scale(0.94) translateY(6px);
    transition: opacity 280ms var(--ease), transform 280ms var(--ease);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #card.visible { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }

  #card .card-label {
    font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--card-accent, #F0A060); margin-bottom: 8px;
  }
  #card .card-title {
    font-family: var(--serif); font-weight: 400; font-size: 15px;
    color: var(--ink); line-height: 1.3; margin-bottom: 10px;
    letter-spacing: -0.01em;
  }
  #card .card-desc {
    font-family: var(--serif); font-weight: 300; font-size: 12.5px;
    color: var(--ink-dim); line-height: 1.6;
  }
  #card .card-close {
    position: absolute; top: 10px; right: 14px;
    font-family: var(--mono); font-size: 12px;
    color: var(--ink-faint); cursor: pointer; pointer-events: auto;
    transition: color 180ms ease;
  }
  #card .card-close:hover { color: var(--ink-dim); }

  /* Scrubber */
  #scrubber {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    display: flex; z-index: 100;
    background: rgba(5,6,14,0.80);
    border: 1px solid var(--rule); border-radius: 3px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .scrub-btn {
    font-family: var(--mono);
    font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-faint); background: none; border: none;
    padding: 10px 22px; cursor: pointer;
    position: relative; transition: color 200ms ease;
    border-right: 1px solid var(--rule);
  }
  .scrub-btn:last-child { border-right: none; }
  .scrub-btn::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: var(--btn-color); transform: scaleX(0);
    transform-origin: left; transition: transform 300ms var(--ease);
  }
  .scrub-btn:hover { color: var(--ink-dim); }
  .scrub-btn.active { color: var(--ink); }
  .scrub-btn.active::before { transform: scaleX(1); }

  #hint {
    position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
    font-family: var(--mono); font-size: 9px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink-faint); pointer-events: none;
    transition: opacity 600ms ease;
  }
  #hint.hidden { opacity: 0; }
  button:active, .fw-cta:active, .tab-btn:active, .visit-btn:active, .compare-btn:active, .cam-btn:active, .hs-toggle:active, .sel-btn:active, .chip:active, .viz-link:active { transform: scale(0.97); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
</style>

<script>
"use strict";

const CHAPTERS = [
  {
    id: 0, label: "Inspirations", color: "#F0A060", dim: "#3a2010",
    nodes: [
      { title: "Thai Education System", desc: "9 years embedded in Thailand's education sector — observing gaps in digital readiness, teacher confidence, and infrastructure at every level." },
      { title: "SEAYLP 2019", desc: "South East Asia Youth Leadership Program at Northern Illinois University. Saw how US teachers used technology naturally; contrast with Thai classrooms stuck me." },
      { title: "Education Upload (2018)", desc: "Grade 11. My school had an innovative curriculum — real skills, real opportunities. Most Thai schools didn't. I wanted to ask why, and make it visible. So I directed a documentary with my juniors: brainstorming, data collection, interviews, scripting, filming, editing, all of it. 2nd place nationally. First time I understood that education was something you could investigate — and maybe change." },
      { title: "Panyaprateep HS — Art & Japanese", desc: "Small class, so I could negotiate my own learning goals. Thai schools teach Japanese at a pace that was too slow for me — I wanted real challenge. So I studied at a middle-school level, then went beyond the textbook: Japanese history, politics, media culture, drama, songs, cooking. That flexibility — shaping your curriculum around what actually drives you — stayed with me as a model for what school could be." },
      { title: "Shutter Story 2018", desc: "Grade 10. Volunteered with EdWings Social Enterprise at a public school in Bangna, Bangkok. No extracurriculars, just academics — students had no space for discovery. We taught photography: DSLRs, phone cameras, visual storytelling. One student I mentored got so hooked she went into an arts-and-technology high school track, then built a career in technical work alongside photography. Seeing that made me realize education reform isn't just about classrooms — it's about what happens outside them too." },
      { title: "MIDL Youth Camp 2019", desc: "I first joined as a participant in 2018 — our group documented the multicultural layering of Talad Noi, Bangkok's oldest street, through a short travel-style music video. In 2019 I came back as a facilitator and content designer for 30 participants: designing workshops on how information is weaponized, how media shapes what people believe, and how to create content that drives social change. Moving from participant to designer in one year was the moment I understood the difference between consuming media literacy and actually teaching it." },
      { title: "CMIC / Samui 2019", desc: "CMIC — Changemaker Incubation Camp — was what we built after returning from SEAYLP in the US. Me and five other Thai alumni, funded by the US Embassy, took what we learned about leadership and social change back to Koh Samui. We ran workshops on design thinking, empathy mapping via community walks, problem framing, and project design. The Samui youth tackled the island's trash problem and built campaigns involving foreign tourists. 100+ people showed up. Covered by local media. For this, I was selected as one of Thailand's 100 Cheewid Impact Creators in 2019 — a national recognition of youth-led social contributions." },
      { title: "Saturday School — Japanese Teacher", desc: "Middle schoolers, grades 7–9, zero Japanese background but curious about anime and J-culture. We didn't teach textbook Japanese — we taught them to learn from what they already loved: their favorite anime, Japanese songs, the cultural history behind them. On 'Big Day,' our class performed a Japanese show at Samyan Mitrtown in front of 1,000+ visitors. Bangkok Governor Chadchart visited and cited our class as a best practice in the Saturday School program. That moment confirmed something: intrinsic motivation makes language learning actually work." },
      { title: "Bilibili Thailand 2020–2024", desc: "Applied for the translator/proofreader role in 2020 — JLPT N1 required. The hard parts: localizing Japanese cultural jokes into Thai equivalents without losing the original nuance; delivering translations within 3 hours of Japan airing; maintaining consistent terminology across 100+ episode series while coordinating with other translators. Over four years: 70+ titles including Naruto, Death Note, Attack on Titan, My Hero Academia, Blue Lock, Black Clover, Tokyo Revengers — accumulated over 1 billion views. That taught me something academic literature rarely captures: how framing and word choice shape what an audience actually takes in." },
      { title: "Thammasat BA — Global Studies", desc: "One of the few Thai programs that combined globalization, social innovation, and social entrepreneurship in one track. First two years: understanding how globalization creates systemic problems. Last two years: studying the social enterprises and innovations responding to them. Annual internships were built in — I spent Year 2 at Saturday School Foundation and Year 3 at the Bangkok Metropolitan Administration, in the office of the deputy governor overseeing education policy. Graduated First Class Honors, GPA 3.72. The program gave me a framework for seeing education not as an isolated sector but as a site where global forces and local realities collide — and showed me how many different actors it takes to actually move a system. That's what pushed me toward graduate study: I wanted to go deeper into innovation from a multidisciplinary lens." },
      { title: "BMA Internship 2023", desc: "Interned in the secretariat of Bangkok's deputy governor for education. Three projects stand out: I built the UNESCO Learning Cities deck that the deputy governor presented to UNESCO — it highlighted Saturday School, a program I'd personally taught in. I designed the slides and narrative for the BMA Strategy Kickoff, communicating the governor's education policies to all 437 Bangkok schools. Most impactful: the Thai Scholarship Database. I mapped all available scholarships against actual student need and found two gaps — most scholarships sit at higher education level, but the real need is primary and secondary; and GPA minimums of 2.5/4.0 mean the most underprivileged students, who had worse schooling, can't qualify. Those findings went to policymakers. That's when I started thinking seriously about how policy design either closes or widens inequality." },
      { title: "TDRI Internship 2019", desc: "10 days embedded with the education research team at Thailand Development Research Institute. I read their past studies and observed how they packaged findings for policymakers — how raw research becomes actionable policy. The 'aha' was simple but real: research can change what decisions get made. I also got fieldwork time — interviewing actual research subjects, practicing observation and note-taking. Those skills came back years later when I designed my own study. First taste of what it means to be a researcher, not just a student." },
      { title: "E-sports Curriculum — Saturday School 2022", desc: "Part of my Saturday School Foundation internship, working in Saturday V — the department that runs CSR and corporate partnership projects. This one was with Garena Thailand, the company behind most major mobile and online games in Southeast Asia. My job: design a curriculum that showed underprivileged students that e-sports is an industry, not just a hobby. Shoutcasting, graphic design, broadcasting, event organizing — real career paths. I also facilitated sessions and coordinated between industry speakers to keep everything aligned with the curriculum I'd built. First time I owned an education project end-to-end." },
      { title: "Hult Prize @ Thammasat 2020", desc: "On the organizing team for the Hult Prize campus competition at Thammasat — a global social entrepreneurship case competition. My role was designing the participant bootcamp learning sessions, specifically design thinking workshops, together with my team from the School of Global Studies. Watching participants work through design thinking in a structured session showed me how much the pedagogy shapes what people think is possible — give someone a framework for empathy and ideation, and their solution space expands visibly." },
      { title: "TikTok @takumyi — Japanese Learning", desc: "Started late 2020 as a joke — just imitating Japanese-related trends as a half-Japanese Thai creator. But the content blew up. I leaned in: Japanese subculture, music, anime, film, everyday culture. My edge was making 1–2 minute videos when most TikTok content was far shorter. That, plus combining videography, editing, and actual Japanese fluency, built something distinct. 85k+ followers. What it taught me: intrinsic motivation — people watching because they genuinely want to learn — makes informal education remarkably sticky." },
      { title: "Edsy — Japan Market 2024", desc: "Edsy (Education Easy) is an EdTech startup building an AI English coaching platform. I joined as Japan market validator — mapping leads, interviewing teachers, gathering feedback to pass to the dev team. Got deep access to how Japanese schools actually operate and how they decide to adopt new learning innovations. Also coordinated with Gakken, one of Japan's largest education companies, as a local partner for market entry. That work expanded into international validation roles in Korea and Saudi Arabia. The Japan school visits planted the seed for my research question — I could see post-GIGA devices sitting unused and teachers navigating a transition no one had prepared them for." },
      { title: "UTokyo ITASIA Program 2025", desc: "Entering the program as a practitioner-researcher. ITASIA's interdisciplinary lens gave me vocabulary to frame what I had been observing for years." },
    ]
  },
  {
    id: 1, label: "Past Research", color: "#5090C0", dim: "#0e1e30",
    nodes: [
      { title: "Mishra & Koehler — TPACK (2006)", desc: "The foundational framework: Technological Pedagogical Content Knowledge. Teachers need all three intersecting knowledge types to teach effectively with technology." },
      { title: "GIGA School Program — Japan", desc: "Japan's 2020–2021 1:1 device rollout for all K-12 students. Largest forced adoption of EdTech in Japanese history. Created natural research conditions." },
      { title: "Thailand 4.0 — EdTech Policy", desc: "National digital economy strategy shaping Thai education's technology investment. Top-down policy vs. ground-level classroom reality." },
      { title: "1:1 Device Classroom Studies", desc: "Literature on what happens when every student has a device: engagement patterns, teacher workflow disruption, equity effects." },
      { title: "Teacher Professional Development in Thailand", desc: "Research on CPD systems, in-service training gaps, and how Thai teachers conceptualize their own growth." },
      { title: "Comparative Education — Japan & Thailand", desc: "Cross-national studies examining how cultural context shapes educational practice, teacher identity, and institutional change." },
      { title: "Technology Integration Models", desc: "SAMR, RAT, TPACK — comparing frameworks for describing how teachers move from substitution to transformation in tech use." },
      { title: "Teacher Beliefs & Technology", desc: "Research showing that beliefs about learning, teaching, and technology predict adoption behavior more than training alone." },
      { title: "Digital Divide in Asian Classrooms", desc: "Infrastructure inequality is documented; less studied is the pedagogical divide — access without pedagogical shift." },
      { title: "Constructivist Learning Theory", desc: "Vygotsky, Piaget, and 1:1 learning: how does individual device access align with (or undermine) social constructivism?" },
      { title: "TPACK Assessment Frameworks", desc: "Survey instruments and observation rubrics developed to measure teacher TPACK levels — methodological toolbox for this study." },
      { title: "Cross-Cultural EdTech Studies", desc: "Research bridging Asia-Pacific educational contexts: similar infrastructure challenges, different cultural pedagogical defaults." },
      { title: "Qualitative Research in Education", desc: "Case study methodology, interview design, and classroom observation protocols — methodological grounding for the study design." },
      { title: "Elementary Teacher Identity", desc: "How primary school teachers construct professional identity and how technology adoption threatens or extends that identity." },
      { title: "UN ESCAP — Digital Inclusion 2024", desc: "Research translation work on digital inclusion for older persons in Japan, Korea, China. Connected policy framing to classroom-level digital transition." }
    ]
  },
  {
    id: 2, label: "Iterations", color: "#5AC8B0", dim: "#0a2820",
    nodes: [
      { title: "Starting Point: Technology in Thai Classrooms", desc: "Initial, broad framing — 'how is technology used in Thai schools?' Too wide, no theoretical anchor." },
      { title: "Discovering TPACK", desc: "First read of Mishra & Koehler. Realized I needed a framework that captured the intersection of content, pedagogy, and technology — not just one dimension." },
      { title: "Adding Comparative Lens", desc: "Expanded beyond Thailand after Edsy fieldwork in Japan. GIGA School created a natural comparative case that matched Thailand's device-push." },
      { title: "Focusing on Elementary Level", desc: "Narrowed from K-12 to elementary. Primary school teachers have the least subject-specialist content support but the most pressure to integrate devices." },
      { title: "The 1:1 Constraint", desc: "Specified '1:1 device classrooms' as the environment. This is the policy outcome both governments are funding — the real-world context of the research." },
      { title: "Framing the Transition", desc: "The word 'transition' became central. Not 'adoption' (passive) or 'mastery' (endpoint), but ongoing professional becoming." },
      { title: "Research Question Draft v1", desc: "First written RQ: too long, three parts, unresolvable. Feedback: simplify to one thing you can actually answer with data." },
      { title: "Methodology Choice: Qualitative", desc: "Rejected survey-based TPACK measurement. Chose qualitative comparative case study — richer, messier, truer to the complexity." },
      { title: "Interview Protocol Design", desc: "Drafted semi-structured interview guide. Piloted with two Japanese teachers. Revised to reduce leading questions, add scenario prompts." },
      { title: "Observation Framework", desc: "Built classroom observation rubric adapting TPACK indicators to 1:1 settings. Identifying what TPACK looks like in practice, not on paper." },
      { title: "Ethics & Fieldwork Planning", desc: "IRB/ethics process, school partner recruitment, scheduling across two countries. Complexity of cross-national qualitative research." },
      { title: "Literature Gap Identification", desc: "TPACK is well-studied in secondary and higher education. Elementary comparative studies in Japan-Thailand: nearly absent. That's the gap." },
      { title: "Cultural Context as Variable", desc: "Realized teacher identity in Japan (specialist, hierarchical) and Thailand (generalist, relational) would shape TPACK development differently — this became theoretically important." },
      { title: "Title Crystallization", desc: "\"Two Countries, One Question\" — the transition from working title to a phrase that holds the comparative logic and the research focus together." },
      { title: "Chapter Outline Draft", desc: "Five chapters: Introduction, Literature Review, Methodology, Findings, Discussion. Mapped how TPACK framework threads through all of them." },
      { title: "Advisor Alignment", desc: "Supervisor meetings refined scope: feasible within program timeline, sufficient methodological rigor, clear contribution to comparative EdTech literature." },
      { title: "Connecting to Coursework", desc: "ITASIA302 and other courses feeding directly into theoretical grounding — digitally-mediated society as the context for why teacher TPACK matters now." },
      { title: "Writing Chapter 1 — Introduction", desc: "Began the actual thesis text. From research question to situated problem statement, from abstract claim to concrete classroom observation." },
      { title: "Recognizing My Positionality", desc: "Practitioner-researcher, bilingual, cross-cultural background — this isn't incidental. It's what makes this comparative study possible and credible." },
      { title: "Current Version", desc: "TPACK transition in elementary teachers in Japan–Thailand 1:1 classrooms. Qualitative comparative case study. Data collection: 2026." }
    ]
  },
  {
    id: 3, label: "Now", color: "#9E90D0", dim: "#1a1530",
    nodes: [
      { title: "Research Question (Working)", desc: "How do elementary school teachers transition into TPACK-based teaching in 1:1 device classrooms across Japan and Thailand?" },
      { title: "Qualitative Comparative Case Study", desc: "Two-country, multi-site design. Elementary schools in Japan (post-GIGA) and Thailand (device rollout ongoing) as parallel cases." },
      { title: "Participants: Elementary Teachers", desc: "Target: 6–10 elementary classroom teachers per country. Purposive sampling for range of tech experience, years teaching, school context." },
      { title: "Methods: Interviews + Observation", desc: "Semi-structured interviews plus classroom observations. Each teacher: 2 interviews (before/after observation) and 2 observed lessons." },
      { title: "Literature Review — In Progress", desc: "Synthesizing TPACK literature, 1:1 device studies, Japan-Thailand educational context, and teacher professional development frameworks." },
      { title: "Fieldwork Planning — 2026", desc: "Japan sites: Tokyo and surrounding prefectures. Thailand sites: Bangkok and Chiang Mai. Fieldwork window: mid-to-late 2026." },
      { title: "Chapter 1 — Introduction Writing", desc: "Drafting the research problem, context, significance, and chapter overview. Making the case for why this study matters now." },
      { title: "Advisor Consultations", desc: "Regular meetings shaping the study design, theoretical framing, and fieldwork approach. Ongoing collaborative development." },
      { title: "ITASIA Coursework Integration", desc: "Using ITASIA302 and other courses as live thinking spaces — assignments as early exploratory writing toward the thesis." },
      { title: "Positionality Statement", desc: "Trilingual Thai-Japanese researcher, 9 years in Thai education, 1 year in Japan. This position is an asset — named and theorized explicitly." },
      { title: "Language as Research Asset", desc: "Thai + Japanese + English fluency means no translation intermediary. Direct access to participants' own words in their own languages." },
      { title: "Connecting Practice to Theory", desc: "Everything from Bilibili translation to Edsy fieldwork to Saturday School teaching threads into the researcher's practical knowledge base." },
      { title: "Digital Storytelling Approach", desc: "The thesis won't just be written — it will be communicated. This portfolio is part of that public research narrative." },
      { title: "Publication Goals", desc: "Targeting a conference paper (2026) and a journal submission based on the comparative findings. Building toward academic contribution." },
      { title: "Expected Completion: 2027", desc: "On track for UTokyo ITASIA master's program timeline. Research, writing, and defense within the 2-year program window." }
    ]
  }
];

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", () => { resize(); computeLayout(); });

// Camera
const cam = { x: 0, y: 0, z: 1, tx: 0, ty: 0, tz: 1 };
const EASE = 0.07;

// State
let focusedChapter = null;
let time = 0;

// Layout
const clusters = [];

function computeLayout() {
  clusters.length = 0;
  const cx = W / 2, cy = H / 2;
  const radius = Math.min(W, H) * 0.28;
  const angles = [-Math.PI * 0.6, -Math.PI * 0.1, Math.PI * 0.4, Math.PI * 0.9];

  CHAPTERS.forEach((ch, i) => {
    const hx = cx + Math.cos(angles[i]) * radius;
    const hy = cy + Math.sin(angles[i]) * radius * 0.72;
    const subRadius = Math.min(W, H) * 0.095;
    const subnodes = ch.nodes.map((n, j) => {
      const a = (j / ch.nodes.length) * Math.PI * 2;
      const r = subRadius * (0.7 + 0.3 * ((j * 7 + 3) % 5) / 4);
      return {
        ...n,
        bx: hx + Math.cos(a) * r,
        by: hy + Math.sin(a) * r,
        ox: 0, oy: 0,
        phase: j * 0.74 + i * 1.3,
        speed: 0.21 + (j % 5) * 0.014,
        amp: 1.5 + (j % 3) * 0.5
      };
    });
    clusters.push({
      ...ch,
      hx, hy,
      ox: 0, oy: 0,
      phase: i * 2.1,
      speed: 0.22 + i * 0.018,
      amp: 2.5 + i * 0.3,
      subnodes
    });
  });
}
computeLayout();

// Hit test helpers
function screenToWorld(sx, sy) {
  return {
    x: (sx - W / 2) / cam.z + cam.x,
    y: (sy - H / 2) / cam.z + cam.y
  };
}
function dist(ax, ay, bx, by) {
  return Math.hypot(ax - bx, ay - by);
}

// Animate nodes
function tickNodes() {
  clusters.forEach(cl => {
    cl.ox = Math.sin(time * cl.speed + cl.phase) * cl.amp;
    cl.oy = Math.cos(time * cl.speed * 0.7 + cl.phase + 1) * cl.amp;
    cl.subnodes.forEach(sn => {
      sn.ox = Math.sin(time * sn.speed + sn.phase) * sn.amp;
      sn.oy = Math.cos(time * sn.speed * 0.8 + sn.phase + 2) * sn.amp;
    });
  });
}

// Draw
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Background gradient matching --bg palette
  const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
  bg.addColorStop(0, "#0b0d1a");
  bg.addColorStop(1, "#05060e");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(cam.z, cam.z);
  ctx.translate(-cam.x, -cam.y);

  clusters.forEach((cl, ci) => {
    const dimmed = focusedChapter !== null && focusedChapter !== ci;
    const focused = focusedChapter === ci;
    const alpha = dimmed ? 0.15 : 1;

    const hx = cl.hx + cl.ox;
    const hy = cl.hy + cl.oy;

    // Sub-node connections + nodes
    if (!dimmed) {
      cl.subnodes.forEach(sn => {
        const sx = sn.bx + sn.ox;
        const sy = sn.by + sn.oy;

        // Connection line
        ctx.beginPath();
        ctx.moveTo(hx, hy);
        ctx.lineTo(sx, sy);
        ctx.strokeStyle = cl.color + "28";
        ctx.lineWidth = 0.8 / cam.z;
        ctx.stroke();

        // Sub-node dot
        const r = focused ? 5 : 3.5;
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.fillStyle = cl.color + (focused ? "cc" : "66");
        ctx.fill();

        if (focused) {
          ctx.font = `300 10px "Geist Mono", "SF Mono", monospace`;
          ctx.fillStyle = "#8899b8";
          ctx.textAlign = "center";
          ctx.fillText(sn.title, sx, sy - 10);
        }
      });
    }

    // Glow halo
    const grd = ctx.createRadialGradient(hx, hy, 0, hx, hy, 55);
    grd.addColorStop(0, cl.color + "22");
    grd.addColorStop(1, "transparent");
    ctx.globalAlpha = alpha;
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(hx, hy, 55, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Hub circle
    const hubR = focused ? 16 : 12;
    ctx.beginPath();
    ctx.arc(hx, hy, hubR, 0, Math.PI * 2);
    ctx.fillStyle = dimmed ? cl.dim : cl.color + "33";
    ctx.fill();
    ctx.strokeStyle = dimmed ? cl.color + "22" : cl.color;
    ctx.lineWidth = (focused ? 2 : 1.5) / cam.z;
    ctx.stroke();

    // Hub label
    if (!dimmed) {
      ctx.font = `500 ${focused ? 11 : 10}px "Geist Mono", "SF Mono", monospace`;
      ctx.fillStyle = dimmed ? cl.color + "44" : cl.color;
      ctx.textAlign = "center";
      ctx.fillText(cl.label.toUpperCase(), hx, hy + hubR + 16);

      const nodeCount = cl.nodes.length;
      ctx.font = `300 9px "Geist Mono", "SF Mono", monospace`;
      ctx.fillStyle = "#2e3a55";
      ctx.fillText(nodeCount + " nodes", hx, hy + hubR + 28);
    }
  });

  ctx.restore();
}

// Camera lerp
function updateCamera() {
  cam.x += (cam.tx - cam.x) * EASE;
  cam.y += (cam.ty - cam.y) * EASE;
  cam.z += (cam.tz - cam.z) * EASE;
}

// Main loop
function loop() {
  time += 0.012;
  tickNodes();
  updateCamera();
  draw();
  requestAnimationFrame(loop);
}
loop();

// Topbar state management
function setTopbarFocused(ci) {
  const ch = CHAPTERS[ci];
  document.getElementById("topbar-title").innerHTML =
    `<a class="back-link" id="topbar-back" href="#">← Overview</a>` +
    ` &nbsp;·&nbsp; <em>${ch.label}</em>`;
  document.getElementById("topbar-back").addEventListener("click", (e) => {
    e.preventDefault();
    resetView();
  });
}

function setTopbarDefault() {
  document.getElementById("topbar-title").innerHTML =
    `<a class="back-link" href="./index.html">← About</a>` +
    ` &nbsp;·&nbsp; Two Countries, <em>One Question</em>`;
}

// Focus on chapter
function focusChapter(ci) {
  focusedChapter = ci;
  const cl = clusters[ci];
  cam.tx = cl.hx;
  cam.ty = cl.hy;
  cam.tz = Math.min(W, H) > 600 ? 2.4 : 1.8;

  setTopbarFocused(ci);
  document.getElementById("hint").classList.add("hidden");
  setScrubActive(ci);
}

function resetView() {
  focusedChapter = null;
  cam.tx = 0; cam.ty = 0; cam.tz = 1;
  setTopbarDefault();
  hideCard();
  document.getElementById("hint").classList.remove("hidden");
}

function setScrubActive(ci) {
  document.querySelectorAll(".scrub-btn").forEach((b, i) => {
    b.classList.toggle("active", i === ci);
  });
}

// Card
function showCard(node, chapterLabel, color, x, y) {
  const card = document.getElementById("card");
  document.getElementById("card-label").textContent = chapterLabel;
  document.getElementById("card-label").style.setProperty("--card-accent", color);
  document.getElementById("card-title").textContent = node.title;
  document.getElementById("card-desc").textContent = node.desc;

  let cx = x + 20, cy = y - 20;
  if (cx + 320 > W) cx = x - 320;
  if (cy + 200 > H) cy = H - 210;
  if (cy < 60) cy = 60;
  card.style.left = cx + "px";
  card.style.top = cy + "px";
  card.classList.add("visible");
}

function hideCard() {
  document.getElementById("card").classList.remove("visible");
}

// Click handling
canvas.addEventListener("click", (e) => {
  const wx = screenToWorld(e.clientX, e.clientY);

  if (focusedChapter === null) {
    for (let ci = 0; ci < clusters.length; ci++) {
      const cl = clusters[ci];
      const hx = cl.hx + cl.ox, hy = cl.hy + cl.oy;
      if (dist(wx.x, wx.y, hx, hy) < 28) {
        focusChapter(ci);
        return;
      }
    }
    return;
  }

  // Check sub-node hit
  const cl = clusters[focusedChapter];
  for (const sn of cl.subnodes) {
    const sx = sn.bx + sn.ox, sy = sn.by + sn.oy;
    if (dist(wx.x, wx.y, sx, sy) < 14) {
      showCard(sn, cl.label, cl.color, e.clientX, e.clientY);
      return;
    }
  }
  hideCard();
});

document.getElementById("card-close").addEventListener("click", hideCard);

// Scrubber
document.querySelectorAll(".scrub-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const ci = parseInt(btn.dataset.ch);
    focusChapter(ci);
    hideCard();
  });
});

// Touch support
canvas.addEventListener("touchend", (e) => {
  const t = e.changedTouches[0];
  canvas.dispatchEvent(new MouseEvent("click", { clientX: t.clientX, clientY: t.clientY }));
});

// Accessibility: build a visually-hidden text version of the journey for screen readers
(function buildSrText() {
  const host = document.getElementById("viz-sr");
  if (!host || typeof CHAPTERS === "undefined") return;
  CHAPTERS.forEach(ch => {
    const h = document.createElement("h2");
    h.textContent = ch.label;
    host.appendChild(h);
    const dl = document.createElement("dl");
    ch.nodes.forEach(n => {
      const dt = document.createElement("dt"); dt.textContent = n.title;
      const dd = document.createElement("dd"); dd.textContent = n.desc;
      dl.appendChild(dt); dl.appendChild(dd);
    });
    host.appendChild(dl);
  });
})();
</script>
<script src="../rain.js" data-color="#5299c8"></script>
<script src="../cursor.js"></script>
</body>
